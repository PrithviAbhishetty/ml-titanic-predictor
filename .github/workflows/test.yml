name: Run Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v2
            
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: '3.14.3'

            - name: Install uv
              uses: astral-sh/setup-uv@v7

            - name: Install dependencies
              run: uv sync --extra test

            - name: Cache trained model
              id: cache-model
              uses: actions/cache@v3
              with:
                path: models/
                key: model-${{ hashFiles('training/train.py') }}

            - name: Download Titanic dataset
              run: |
                mkdir -p data
                curl -L https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv \
                -o data/titanic.csv

            - name: Train model
              if: steps.cache-model.outputs.cache-hit != 'true'
              env:
                DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
              run: |
                uv run python training/train.py

            - name: Validate model
              run: |
                uv run python training/validate.py

            - name: Run unit tests
              run: |
                uv run pytest tests/test_unit.py -v

            - name: Run integration tests
              run: |
                uv run pytest tests/test_integration.py -v

            - name: Upload model to DagsHub
              if: steps.cache-model.outputs.cache-hit != 'true'
              env:
                DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
              run: |
                uv run dvc push

            - name: Deploy to staging
              if: github.event_name == 'pull_request'
              run: |
                curl -s -X PATCH \
                  "https://api.render.com/v1/services/${{ secrets.RENDER_STAGING_SERVICE_ID }}" \
                  -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
                  -H "Content-Type: application/json" \
                  -d '{"branch": "${{ github.head_ref }}"}'

                curl -s -X POST \
                  "https://api.render.com/v1/services/${{ secrets.RENDER_STAGING_SERVICE_ID }}/deploys" \
                  -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY}}" \
                  -H "Content-Type: application/json"

            - name: Get Vercel preview URL
              if: github.event_name == 'pull_request'
              id: vercel-url
              run: |
                url=$(curl -s "https://api.vercel.com/v6/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&limit=10" \
                  -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
                  | jq -r '[.deployments[] | select(.meta.githubCommitRef == "${{ github.head_ref }}")][0].url')
                echo "url=https://${url}" >> $GITHUB_OUTPUT

            - name: Install Playwright browsers
              if: github.event_name == 'pull_request'
              run: uv run playwright install chromium --with-deps

            - name: Run E2E tests
              if: github.event_name == 'pull_request'
              env:
                E2E_BASE_URL: ${{ steps.vercel-url.outputs.url }}
                E2E_BACKEND_URL: https://ml-titanic-predictor-staging.onrender.com
                VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
              run: |
                uv run pytest tests/test_e2e.py -v -s

            - name: Upload Playwright screenshot
              if: github.event_name == 'pull_request' && always()
              uses: actions/upload-artifact@v6
              with:
                name: playwright-screenshot
                path: screenshot.png